<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4c1d95"/>
      <stop offset="50%" style="stop-color:#6d28d9"/>
      <stop offset="100%" style="stop-color:#2e1065"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24"/>
      <stop offset="50%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#d97706"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="shine" cx="30%" cy="30%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0"/>
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" fill="url(#bg)"/>
  
  <!-- Shine effect -->
  <circle cx="150" cy="150" r="200" fill="url(#shine)"/>
  
  <!-- Cross with glow -->
  <g filter="url(#glow)">
    <!-- Vertical bar -->
    <rect x="236" y="120" width="40" height="272" rx="8" fill="url(#gold)"/>
    <!-- Horizontal bar -->
    <rect x="140" y="216" width="232" height="40" rx="8" fill="url(#gold)"/>
  </g>
  
  <!-- Cross highlight -->
  <rect x="236" y="120" width="20" height="272" rx="8" fill="#fcd34d" opacity="0.6"/>
  <rect x="140" y="216" width="232" height="20" rx="8" fill="#fcd34d" opacity="0.6"/>
</svg>
